server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Permite upload de imagens de até 10MB pelo painel Admin
    client_max_body_size 10M;

    # Proxy reverso da API para o container do backend
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy reverso dos uploads locais para o container do backend
    location /uploads/ {
        proxy_pass http://backend:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Cache longo para assets estáticos versionados
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fallback para rotas SPA do React Router (/clube, /admin/login, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

